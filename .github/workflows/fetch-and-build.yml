name: Fetch and Build

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      version_budget:
        description: "Max version-fetches per shard (default: 600000 × 8 shards)"
        required: false
        default: "600000"
      notify_url:
        description: "ntfy.sh webhook URL for completion notification"
        required: false
        default: ""
      dry_run:
        description: "Compute watermark but do not push historial"
        type: boolean
        required: false
        default: false

concurrency:
  group: historial-write
  cancel-in-progress: false

# ── Phase 1: parallel fetch shards ─────────────────────────────────────────────
# Each shard runs on its own runner (different IP) and fetches a disjoint slice
# of normas (id_norma % 8 == shard_index).  Results are committed to a temporary
# pipeline-cache-shard-{k} branch and merged in the consolidate job below.

jobs:
  fetch-shard:
    name: "Fetch shard ${{ matrix.shard }}/8"
    strategy:
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
      fail-fast: false   # let other shards finish even if one fails
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "ley-chile-bot"
          git config user.email "bot@ley-chile"

      - name: Set up pipeline-cache worktree (shard branch)
        run: |
          git fetch origin pipeline-cache
          git branch -f pipeline-cache origin/pipeline-cache
          git worktree add cache pipeline-cache
          # Each shard works on its own branch so pushes don't collide.
          git -C cache checkout -b pipeline-cache-shard-${{ matrix.shard }}

      - name: Fetch versions (shard ${{ matrix.shard }}/8)
        run: |
          python scripts/fetch_versions.py \
            --data-root . \
            --cache-dir ./cache \
            --version-budget ${{ github.event.inputs.version_budget || '2500' }} \
            --shard ${{ matrix.shard }}/8 \
            --max-transient-failures 8 \
            --verbose

      - name: Commit and push shard branch
        run: |
          git -C cache add -A
          if git -C cache diff --cached --quiet; then
            echo "shard ${{ matrix.shard }}: no new data"
          else
            git -C cache commit -m \
              "shard-${{ matrix.shard }}: fetch $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          # Force-push: a previous failed run may have left a stale shard branch.
          git push --force origin \
            "pipeline-cache-shard-${{ matrix.shard }}:refs/heads/pipeline-cache-shard-${{ matrix.shard }}"

# ── Phase 2: consolidate + build ───────────────────────────────────────────────
# Merges all shard branches into pipeline-cache, rebuilds historial, pushes both.

  consolidate:
    name: Consolidate and build
    needs: fetch-shard
    if: always()   # run even when some shards fail; apply whatever data landed
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "ley-chile-bot"
          git config user.email "bot@ley-chile"
          git config http.postBuffer 524288000   # 500 MB — helps with large historial push

      # ── pipeline-cache worktree ────────────────────────────────────────────
      - name: Set up pipeline-cache worktree
        run: |
          CODE_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          if git fetch origin pipeline-cache 2>/dev/null; then
            git branch -f pipeline-cache origin/pipeline-cache
            git worktree add cache pipeline-cache
          else
            git checkout --orphan pipeline-cache
            git rm -rf . --quiet
            git commit --allow-empty -m "init: pipeline-cache branch"
            git push origin pipeline-cache
            git checkout "$CODE_BRANCH"
            git worktree add cache pipeline-cache
          fi

      # ── historial worktree ─────────────────────────────────────────────────
      - name: Set up historial worktree
        run: |
          CODE_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          if git fetch origin historial 2>/dev/null; then
            git branch -f historial origin/historial
            git worktree add historial historial
          else
            git checkout --orphan historial
            git rm -rf . --quiet
            git commit --allow-empty -m "init: historial branch"
            git push origin historial
            git checkout "$CODE_BRANCH"
            git worktree add historial historial
          fi

      # ── Merge shard branches ───────────────────────────────────────────────
      - name: Apply shard data to pipeline-cache
        run: |
          APPLIED=0
          for k in 0 1 2 3 4 5 6 7; do
            if git fetch origin "pipeline-cache-shard-$k" 2>/dev/null; then
              # Identify files added/changed by this shard vs current pipeline-cache HEAD.
              NEW=$(git -C cache diff HEAD..origin/pipeline-cache-shard-$k --name-only)
              if [ -n "$NEW" ]; then
                echo "$NEW" | xargs git -C cache checkout "origin/pipeline-cache-shard-$k" --
                echo "  shard $k: applied $(echo "$NEW" | wc -l) file(s)"
                APPLIED=$((APPLIED + 1))
              else
                echo "  shard $k: no new files"
              fi
              # Remove the temporary shard branch from the remote.
              git push origin --delete "pipeline-cache-shard-$k" || true
            else
              echo "  shard $k: branch not found (shard may have failed)"
            fi
          done
          echo "Shards applied: $APPLIED"

      - name: Merge shard progress files and commit pipeline-cache
        run: |
          # Merge all fetch_versions_progress-shard-*.json into the main progress file,
          # then remove the shard files so they don't clutter pipeline-cache.
          python - <<'EOF'
          import json
          from pathlib import Path

          cache = Path("cache")
          main_file = cache / "fetch_versions_progress.json"
          main = json.loads(main_file.read_text()) if main_file.exists() else {"done": [], "failed": {}}
          done = set(main.get("done", []))
          failed = dict(main.get("failed", {}))

          for f in sorted(cache.glob("fetch_versions_progress-shard-*.json")):
              shard = json.loads(f.read_text())
              done.update(shard.get("done", []))
              for id_str, cnt in shard.get("failed", {}).items():
                  failed[id_str] = max(failed.get(id_str, 0), cnt)
              f.unlink()

          main_file.write_text(json.dumps({"done": sorted(done), "failed": failed}))
          print(f"Merged progress: {len(done)} done, {len([v for v in failed.values() if v > 0])} with failures")
          EOF

          git -C cache add -A
          git -C cache diff --cached --quiet && echo "No new cache data" || (
            git -C cache commit -m \
              "cache: merge 8 shards $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for attempt in 1 2 3 4; do
              git push origin pipeline-cache && break || sleep $((attempt * 3))
            done
          )

      # ── Step 2: compute watermark ──────────────────────────────────────────
      - name: Compute watermark
        id: watermark
        run: |
          python scripts/compute_watermark.py \
            --graph-path ./graph.json \
            --cache-dir ./cache \
            --historial-dir ./historial \
            --output-env

      # ── Step 3: rebuild historial ──────────────────────────────────────────
      - name: Rebuild historial from cache
        if: |
          steps.watermark.outputs.watermark_advanced == 'true' &&
          github.event.inputs.dry_run != 'true'
        run: |
          python scripts/build_history.py \
            --data-root . \
            --cache-dir ./cache \
            --rebuild \
            --enrichers tramitacion

      - name: Push historial (chunked + force-with-lease)
        if: |
          steps.watermark.outputs.watermark_advanced == 'true' &&
          github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail

          # Large packs hit GitHub's HTTP 500 in a single RPC.  Push in
          # CHUNK_SIZE-commit slices (oldest-first) so each request only sends
          # an incremental delta, then do a final force-with-lease on the tip.
          CHUNK_SIZE=500
          mapfile -t COMMITS < <(git log --reverse --format="%H" historial)
          TOTAL=${#COMMITS[@]}
          echo "historial: $TOTAL commits, pushing in chunks of $CHUNK_SIZE"

          # Intermediate chunks — plain --force is fine here; the lease guard
          # only matters for the final tip to catch concurrent writes.
          for ((i = CHUNK_SIZE - 1; i < TOTAL - 1; i += CHUNK_SIZE)); do
            sha="${COMMITS[$i]}"
            echo "  chunk: commits 1..$((i+1)) / $TOTAL  ($sha)"
            git push --force origin "$sha:refs/heads/historial"
          done

          # Final tip — force-with-lease refuses to clobber a concurrent push.
          PUSHED=0
          for attempt in 1 2 3 4; do
            if git push --force-with-lease origin historial; then
              PUSHED=1; break
            fi
            echo "Attempt $attempt failed; fetching and retrying in $((attempt * 3))s..."
            git fetch origin historial || true
            sleep $((attempt * 3))
          done
          [ $PUSHED -eq 1 ] || { echo "ERROR: historial push failed after 4 attempts"; exit 1; }

      # ── Step 4: update README ──────────────────────────────────────────────
      - name: Update README status
        run: |
          python scripts/update_readme_status.py \
            --readme README.md \
            --graph-path ./graph.json \
            --cache-dir ./cache \
            --historial-dir ./historial

      - name: Commit README
        run: |
          git add README.md
          git diff --cached --quiet && echo "README unchanged" || (
            git commit -m \
              "chore: update pipeline status [skip ci]"
            git push origin ${{ github.ref_name }}
          )

      # ── Notification ───────────────────────────────────────────────────────
      - name: Notify completion
        if: ${{ github.event.inputs.notify_url != '' }}
        run: |
          curl -s -X POST ${{ github.event.inputs.notify_url }} \
            -H "Content-Type: application/json" \
            -d "{\"title\": \"ley-chile fetch-and-build done\",
                 \"message\": \"cache=${{ steps.watermark.outputs.cached_normas }}/${{ steps.watermark.outputs.total_normas }} watermark=${{ steps.watermark.outputs.D }}\"}" \
            || true
