name: Redirect pages

# The SPA at web/ has been superseded by the SSR site at https://leyes.pisanvs.cl.
# GitHub Pages (https://pisanvs.github.io/ley-chile/) now serves a redirect to it
# instead of rebuilding the old SPA on every historial push. web/ source stays in
# the repo and buildable; it's just no longer the deployed surface.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Generate redirect site
        run: |
          mkdir -p _site
          touch _site/.nojekyll
          # index.html handles the bare root; 404.html catches every deep link
          # (GitHub Pages serves 404.html for any path with no file), so a saved
          # /ley-chile/ley/20000 lands on https://leyes.pisanvs.cl/ley/20000.
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="es">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>ley·chile se mudó a leyes.pisanvs.cl</title>
          <link rel="canonical" href="https://leyes.pisanvs.cl/">
          <meta name="robots" content="noindex,follow">
          <script>
            (function () {
              var target = 'https://leyes.pisanvs.cl';
              var base = '/ley-chile';
              var path = location.pathname;
              if (path.indexOf(base) === 0) path = path.slice(base.length);
              if (!path) path = '/';
              location.replace(target + path + location.search + location.hash);
            })();
          </script>
          <meta http-equiv="refresh" content="0;url=https://leyes.pisanvs.cl/">
          <style>
            body{font-family:system-ui,-apple-system,sans-serif;max-width:32rem;margin:20vh auto;padding:0 1.5rem;color:#2b2b2b;line-height:1.6}
            a{color:#c13f3f;font-weight:600}
          </style>
          </head>
          <body>
          <h1>ley·chile se mudó</h1>
          <p>El sitio ahora vive en <a href="https://leyes.pisanvs.cl">leyes.pisanvs.cl</a>. Te estamos redirigiendo…</p>
          </body>
          </html>
          HTML
          cp _site/index.html _site/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
