name: Build pages
on:
  push:
    branches: [historial]
  workflow_dispatch:
  workflow_run:
    workflows: ["Pipeline"]
    types: [completed]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, but don't cancel in-progress runs as we
# want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (sparse — code only)
        uses: actions/checkout@v4
        with:
          ref: main
          path: code
          sparse-checkout: |
            scripts
            web
            requirements.txt
          sparse-checkout-cone-mode: false

      - name: Checkout historial (data)
        uses: actions/checkout@v4
        with:
          ref: historial
          path: historial
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install Python deps
        run: pip install -r code/requirements.txt

      - name: Build indexes
        run: |
          python code/scripts/build_web_indexes.py \
            --historial historial \
            --out code/web/public \
            --repo ${{ github.repository }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with: { version: 9 }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: code/web/pnpm-lock.yaml

      - name: Install web deps
        run: pnpm --dir code/web install --frozen-lockfile

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build SPA
        env:
          VITE_BASE: /ley-chile/
          VITE_REPO: ${{ github.repository }}
        run: pnpm --dir code/web build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: code/web/dist

  # Deployment job
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
