name: Bulk Fetch Laws (DEPRECATED)

# DEPRECATED 2026-05-31.  The bulk_fetch.py pipeline wrote per-norma commits
# directly to historial in parallel with the newer fetch-and-build pipeline,
# which caused two sources of truth and corrupted the watermark logic in
# compute_watermark (W advanced to today via chore commits, blocking the new
# pipeline's Build historial step).
#
# Historial is now a deterministic artifact regenerated by build_history.py
# --rebuild from the diffs cache — see fetch-and-build.yml.
#
# This workflow is retained for archival reference only.  The schedule
# trigger is commented out so it no longer fires; workflow_dispatch is
# preserved so a maintainer can still invoke it manually if absolutely needed.
on:
  # schedule:
  #   - cron: "*/15 * * * *"   # disabled — see deprecation note above
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Laws to process per run (default: 20)"
        required: false
        default: "20"
      refresh_catalog:
        description: "Force-refresh SPARQL catalog"
        required: false
        default: "false"
        type: boolean
      skip_rebuild:
        description: "Skip git fast-import history rebuild"
        required: false
        default: "true"
        type: boolean

# Only one bulk-fetch or daily-sync job runs at a time.
# The cancel-in-progress: false ensures the running job finishes cleanly.
concurrency:
  group: historial-write
  cancel-in-progress: false

jobs:
  bulk-fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "ley-chile-bot"
          git config user.email "bot@ley-chile"

      - name: Set up historial worktree
        run: |
          git fetch origin historial || (
            git checkout --orphan historial &&
            git rm -rf . &&
            git commit --allow-empty -m "init: historial branch" &&
            git checkout - &&
            git push origin historial
          )
          git worktree add historial historial

      - name: Run bulk fetch
        env:
          LEYCHILE_DATA_ROOT: ${{ github.workspace }}/historial
        run: |
          ARGS="--batch-size ${{ github.event.inputs.batch_size || '20' }}"
          if [ "${{ github.event.inputs.refresh_catalog }}" = "true" ]; then
            ARGS="$ARGS --refresh-catalog"
          fi
          # Default: skip rebuild during bulk fetch to keep runs fast.
          # rebuild_history is run by the daily sync job at 05:00 AM.
          if [ "${{ github.event.inputs.skip_rebuild }}" = "false" ]; then
            :  # explicit override: run rebuild
          else
            ARGS="$ARGS --skip-rebuild"
          fi
          python scripts/bulk_fetch.py $ARGS

      - name: Push historial branch
        run: |
          git -C historial status --short
          # Push with retry on transient network failures
          for attempt in 1 2 3 4; do
            git push origin historial && break
            sleep $((attempt * 2))
          done
